# Push to main -> backend tests, front-end build, lint -> deploy to Fly.io.
# Deploy is skipped until the FLY_API_TOKEN repository secret exists.
name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Backend
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt && pip install --no-deps -e .
          ruff check . && ruff format --check .
          pytest
      - name: Front end
        working-directory: frontend
        run: npm ci && npm run lint && npx tsc -b && npm run build && npm run check-bundle
      # Advisory only: a new CVE in a dependency shows up here without blocking the deploy
      # (the same two commands as `make audit`).
      - name: Dependency audit (non-blocking)
        continue-on-error: true
        run: |
          (cd frontend && npm audit --omit=dev) || true
          pip freeze | grep -v -i 'trading.portal' > /tmp/tp-audit-requirements.txt
          pipx run pip-audit -r /tmp/tp-audit-requirements.txt --progress-spinner off || true

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Skip until Fly is set up
        if: env.FLY_API_TOKEN == ''
        run: echo "No FLY_API_TOKEN secret yet, so nothing is deployed."
      - uses: actions/checkout@v4
        if: env.FLY_API_TOKEN != ''
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: env.FLY_API_TOKEN != ''
      - run: flyctl deploy --remote-only
        if: env.FLY_API_TOKEN != ''
