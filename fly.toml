# Fly.io config. The app does not exist yet: create it once with
#   fly apps create trading-portal-jamie && fly volumes create portal_data --size 1 --region lhr
# (change the name if it's taken, here and in .github/workflows/deploy.yml).
app = "trading-portal-jamie"
primary_region = "lhr"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # Always on (F7): the in-app scheduler sends news alerts by Web Push and refreshes the news feeds,
  # so the one machine must never stop. Roughly $2–4/month on shared-cpu-1x.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "portal_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
