[project]
name = "trading-portal"
version = "0.1.0"
description = "Trading Portal API: FastAPI + SQLAlchemy/Alembic + SQLite"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic-settings>=2.6",
  "argon2-cffi>=23.1",
  "cryptography>=43",
  "webauthn>=2.4",
  "python-multipart>=0.0.12",
  "pillow>=11.3",
  "httpx>=0.27",
  "pywebpush>=2.0",
  "python-dateutil>=2.9",
  "boto3>=1.35",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
